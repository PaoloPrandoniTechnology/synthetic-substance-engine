version: 1
default: ollama-local
providers:
  - id: ollama-local
    kind: ollama
    baseUrl: http://127.0.0.1:11434
    models:
      - llama3.1:8b
      - qwen2.5:7b
  - id: lmstudio-local
    kind: openai-compatible
    baseUrl: http://127.0.0.1:1234/v1
    models:
      - local-model
  - id: openai-cloud
    kind: openai
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
    models:
      - gpt-4o-mini
