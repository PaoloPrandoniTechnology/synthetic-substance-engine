schema: 1
id: allucinazione-controllata
name: Allucinazione Controllata
family: delirante
intensity: 0.55
onsetSeconds: 10
peakSeconds: 60
plateauSeconds: 120
decaySeconds: 300
distortions:
  params:
    temperature: 0.45
    topP: 0.08
    maxTemperature: 1.6
  context:
    synesthesia: 0.35
  logit:
    mode: associative-drift
    strength: 0.40
    maxBiasedTokens: 8
    # Valido solo su provider con lo stesso tokenizer dichiarato (es. openai-cloud)
    targetTokenizer: o200k_base
    tokens:
      - text: "sogno"
        bias: 8
      - text: "ombra"
        bias: 6
      - text: "specchio"
        bias: 5
effects:
  - "dettagli inventati ma coerenti, tenuti dentro i bordi della scena"
  - "deriva onirica senza perdere il filo del discorso"
contraindications:
  - "risposte fattuali, codice e dati verificabili"
